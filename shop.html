<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAWI | Tienda</title>
    <meta name="description" content="Colección completa RAWI. Moda minimalista y atemporal.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAV (Simple) -->
    <nav class="main-nav">
        <a href="index.html" class="nav-logo">RAWI</a>
        <div class="nav-links">
            <a href="shop.html" class="active">TIENDA</a>
            <a href="index.html#collection">DESTACADOS</a>
        </div>
    </nav>

    <!-- SHOP HEADER -->
    <header class="shop-header">
        <h1>COLECCIÓN COMPLETA</h1>
        <p>Esenciales con carácter.</p>
    </header>

    <!-- FILTERS -->
    <div class="shop-filters">
        <button class="filter-btn active">Todo</button>
        <button class="filter-btn">Superiores</button>
        <button class="filter-btn">Inferiores</button>
        <button class="filter-btn">Accesorios</button>
    </div>

    <!-- PRODUCT GRID -->
    <section class="shop-grid section-padding">
        <!-- Product 1 -->
        <article class="product-card">
            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?q=80&w=1769&auto=format&fit=crop"
                    alt="Abrigo Estructurado">
            </div>
            <div class="product-info">
                <h3 class="product-name">ABRIGO ESTRUCTURADO</h3>
                <span class="product-price">$3,200</span>
                <button class="btn btn-small">Añadir</button>
            </div>
        </article>

        <!-- Product 2 -->
        <article class="product-card">
            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1920&auto=format&fit=crop"
                    alt="Blazer Oversize">
            </div>
            <div class="product-info">
                <h3 class="product-name">BLAZER OVERSIZE</h3>
                <span class="product-price">$2,800</span>
                <button class="btn btn-small">Añadir</button>
            </div>
        </article>

        <!-- Product 3 -->
        <article class="product-card">
            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1434389677669-e08b4cac3105?q=80&w=2005&auto=format&fit=crop"
                    alt="Pantalón Sastre">
            </div>
            <div class="product-info">
                <h3 class="product-name">PANTALÓN SASTRE</h3>
                <span class="product-price">$1,950</span>
                <button class="btn btn-small">Añadir</button>
            </div>
        </article>

        <!-- Product 4 -->
        <article class="product-card">
            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1532453288672-3a27e9be9efd?q=80&w=1964&auto=format&fit=crop"
                    alt="Camisa Estructurada">
            </div>
            <div class="product-info">
                <h3 class="product-name">CAMISA TÉCNICA</h3>
                <span class="product-price">$1,450</span>
                <button class="btn btn-small">Añadir</button>
            </div>
        </article>

        <!-- Product 5 -->
        <article class="product-card">
            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1589363359600-b851b9b18751?q=80&w=1887&auto=format&fit=crop"
                    alt="Pantalón Lino">
            </div>
            <div class="product-info">
                <h3 class="product-name">PANTALÓN LINO</h3>
                <span class="product-price">$2,100</span>
                <button class="btn btn-small">Añadir</button>
            </div>
        </article>

        <!-- Product 6 -->
        <article class="product-card">
            <div class="product-image">
                <img src="https://images.unsplash.com/photo-1550614000-4b9519e09eb3?q=80&w=1887&auto=format&fit=crop"
                    alt="Top Básico">
            </div>
            <div class="product-info">
                <h3 class="product-name">TOP BÁSICO SILK</h3>
                <span class="product-price">$980</span>
                <button class="btn btn-small">Añadir</button>
            </div>
        </article>
    </section>

    <!-- FOOTER NAV -->
    <footer class="closing-section">
        <div class="closing-content">
            <a href="index.html" class="btn btn-primary btn-large">VOLVER AL INICIO</a>
        </div>
    </footer>

</body>

</html>
